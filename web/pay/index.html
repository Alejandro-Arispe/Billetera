<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Pagar con Billetera</title>
  <link rel="stylesheet" href="/pay/pay.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="logo">B</span> Billetera</div>
      <button id="logout" class="link hidden" type="button">Salir</button>
    </header>

    <p id="error" class="alert hidden" role="alert"></p>

    <!-- 1. Login -->
    <section id="view-login" class="card hidden">
      <h1>Inicia sesión para pagar</h1>
      <form id="form-login">
        <label>Correo <input name="email" type="email" autocomplete="email" required /></label>
        <label>Contraseña <input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">Ingresar</button>
      </form>
    </section>

    <!-- 2. Escanear (si se abrió /pay sin un QR) -->
    <section id="view-scan" class="card hidden">
      <h1>Escanea el QR del comercio</h1>
      <div id="reader" class="reader"></div>
      <button id="start-camera" class="secondary" type="button">Usar la cámara</button>
      <form id="form-paste">
        <label>…o pega el contenido del QR <input name="qr" placeholder="http://…/pay?i=…&s=…" required /></label>
        <button class="secondary" type="submit">Abrir cobro</button>
      </form>
    </section>

    <!-- 3. Confirmar pago -->
    <section id="view-confirm" class="card hidden">
      <p class="muted">Pagar a</p>
      <h1 id="c-merchant"></h1>
      <p class="amount" id="c-amount"></p>
      <p class="muted" id="c-desc"></p>
      <ul id="c-items" class="items"></ul>
      <p class="timer" id="c-timer"></p>

      <h2>Pagar con</h2>
      <div id="c-funding" class="funding"></div>

      <form id="form-pay">
        <label>PIN de pagos
          <input name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required class="code" />
        </label>
        <button id="pay-btn" class="primary" type="submit">Pagar</button>
      </form>
    </section>

    <!-- 4. Resultado -->
    <section id="view-done" class="card hidden center">
      <div class="check">✓</div>
      <h1>¡Pago realizado!</h1>
      <p class="amount" id="d-amount"></p>
      <p id="d-merchant"></p>
      <p class="muted" id="d-debited"></p>
      <p class="muted small" id="d-tx"></p>
      <button id="again" class="secondary" type="button">Pagar otro QR</button>
    </section>

    <p id="loading" class="muted center hidden">Cargando…</p>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="/pay/pay.js" defer></script>
</body>
</html>
